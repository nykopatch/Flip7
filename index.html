<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Flip 7 – Score</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip 7">
<meta name="theme-color" content="#14122b">
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
:root{
  --bg:#14122b; --card:#1f1c3d; --card2:#2a2650; --text:#f4f2ff; --muted:#9b97c4;
  --accent:#ffc83d; --accent2:#ff5d8f; --good:#3ddc97; --bad:#ff5d6c;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:calc(var(--safe-t) + 12px) 14px calc(var(--safe-b) + 40px);max-width:560px;margin:0 auto}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;font-weight:700}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--card2);padding:13px 16px;border-radius:14px;font-weight:700;font-size:16px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#2b2100}
.btn.danger{background:rgba(255,93,108,.18);color:var(--bad)}
.btn.full{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
input[type=text],input[type=number],input[type=tel]{
  font:inherit;font-size:17px;width:100%;padding:13px 14px;border-radius:12px;border:2px solid transparent;
  background:var(--card2);color:var(--text);outline:none;-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pitem{display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:11px 14px;border-radius:12px;font-weight:600}
.pitem button{background:none;color:var(--bad);font-size:20px;padding:0 4px}
.target{display:flex;gap:8px;margin-top:6px}
.target button{flex:1;padding:11px 0;border-radius:12px;background:var(--card2);font-weight:700}
.target button.on{background:var(--accent);color:#2b2100}

.cover{margin-bottom:14px;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cover svg{display:block;width:100%;height:auto}
/* scoreboard */
.sb{display:flex;flex-direction:column;gap:10px}
.sbrow{position:relative;background:var(--card2);border-radius:14px;padding:12px 14px;overflow:hidden}
.sbrow .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,200,61,.22),rgba(255,93,143,.22));z-index:0;transition:width .4s}
.sbrow .in{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.rank{width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.sbrow.first .rank{background:var(--accent);color:#2b2100}
.nm{flex:1;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-size:13px;font-weight:700;color:var(--good)}
.delta.neg{color:var(--bad)}
.tot{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.goal{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}

/* round */
.rrow{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:14px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.rrow .nm{font-size:17px}
.badge{min-width:58px;text-align:center;padding:7px 12px;border-radius:10px;background:var(--card);font-weight:800;font-size:17px;color:var(--muted)}
.badge.set{background:var(--good);color:#06301d}
.badge.bust{background:var(--bad);color:#fff}
.badge.f7{background:var(--accent);color:#2b2100}

.hint2{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.rrow2{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px}
.rrow2 .nm{font-size:17px}
.sin{width:78px!important;padding:11px 8px!important;text-align:center;font-weight:800;font-size:19px!important;background:var(--card)!important}
.sin.bust{color:var(--bad)}
.ib{width:44px;height:44px;border-radius:12px;background:var(--card);font-size:20px;flex:none}
.ib.b{background:rgba(255,93,108,.18)}
.ib:active{transform:scale(.94)}
td.ed{cursor:pointer;border-radius:8px}
td.ed:active{background:var(--card2)}
/* banner */
.win{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#2b0f1a;text-align:center;border-radius:18px;padding:20px;margin-bottom:14px}
.win .big{font-size:30px;font-weight:900}
.win p{margin:6px 0 14px;font-weight:600}

/* history */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:8px 6px;text-align:center}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
td:first-child,th:first-child{text-align:left;color:var(--muted)}
tr+tr td{border-top:1px solid rgba(255,255,255,.06)}
td.z{color:var(--bad)}
tfoot td{font-weight:800;border-top:2px solid rgba(255,255,255,.15)}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.foot{display:flex;gap:10px;margin-top:6px}
.foot .btn{flex:1;font-size:14px;padding:12px 8px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,4,15,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(var(--safe-b) + 18px);max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 2px;font-size:22px}
.sheet .hint{color:var(--muted);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.chip{padding:14px 0;border-radius:12px;background:var(--card2);font-weight:800;font-size:19px}
.chip.on{background:var(--accent);color:#2b2100}
.chip.mod{font-size:16px}
.chip.mod.on{background:var(--accent2);color:#fff}
.grid.mods{grid-template-columns:repeat(6,1fr)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin:6px 0 8px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--card2);border-radius:14px;padding:12px 16px;margin:10px 0}
.total b{font-size:34px;font-variant-numeric:tabular-nums}
.total small{color:var(--accent);font-weight:700}
.sheet .actions{display:flex;gap:10px;margin-top:12px}
.sheet .actions .btn{flex:1}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Flip <span>7</span></h1>
<p class="sub" id="sub"></p>
<div id="app"></div>

<div class="overlay" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const KEY='flip7-score-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={players:[],target:200,rounds:[],pending:{},started:false};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* icône iPhone générée */
(function(){
  const c=document.createElement('canvas');c.width=c.height=180;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#3b2f8f');g.addColorStop(1,'#14122b');
  x.fillStyle=g;x.fillRect(0,0,180,180);
  const gold=x.createLinearGradient(0,66,0,150);gold.addColorStop(0,'#ffc83d');gold.addColorStop(1,'#ff5d8f');
  const bar=(a,b,w,h,f)=>{x.fillStyle=f;x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,8);else x.rect(a,b,w,h);x.fill();};
  bar(24,100,36,50,'#6c63d9');bar(70,68,40,82,gold);bar(120,116,36,34,'#4a43a8');
  x.fillStyle='#ffc83d';x.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:17;x.lineTo(90+r*Math.cos(a),42+r*Math.sin(a));}
  x.closePath();x.fill();
  $('#touchIcon').href=c.toDataURL('image/png');
})();

const totals=()=>S.players.map((_,i)=>S.rounds.reduce((a,r)=>a+(r[i]||0),0));

/* ---------- SETUP ---------- */
function renderSetup(){
  $('#sub').textContent='Suivi de score · configure la partie';
  $('#app').innerHTML=`
    <div class="cover">
      <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carnet de score">
        <defs>
          <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2f8f"/><stop offset="1" stop-color="#14122b"/></linearGradient>
          <linearGradient id="cvBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff5d8f"/></linearGradient>
        </defs>
        <rect width="360" height="170" rx="20" fill="url(#cvBg)"/>
        <g opacity=".85">
          <circle cx="30" cy="24" r="4" fill="#3ddc97"/><circle cx="118" cy="16" r="3" fill="#ff5d8f"/>
          <circle cx="178" cy="34" r="5" fill="#ffc83d"/><circle cx="332" cy="26" r="4" fill="#3ddc97"/>
          <circle cx="198" cy="150" r="3" fill="#ff5d8f"/><circle cx="24" cy="150" r="4" fill="#ffc83d"/>
          <rect x="146" y="26" width="8" height="8" rx="2" fill="#ff5d8f" transform="rotate(25 150 30)"/>
          <rect x="316" y="62" width="8" height="8" rx="2" fill="#ffc83d" transform="rotate(-20 320 66)"/>
        </g>
        <text x="20" y="92" font-size="34" font-weight="900" fill="#f4f2ff" font-family="-apple-system,Helvetica,Arial,sans-serif">Carnet</text>
        <text x="20" y="128" font-size="34" font-weight="900" fill="#ffc83d" font-family="-apple-system,Helvetica,Arial,sans-serif">de score</text>
        <polygon points="276,56 279,64 288,64 281,69 284,78 276,73 268,78 271,69 264,64 273,64" fill="#ffc83d"/>
        <rect x="222" y="104" width="40" height="46" rx="8" fill="#6c63d9"/>
        <rect x="266" y="84" width="44" height="66" rx="8" fill="url(#cvBar)"/>
        <rect x="314" y="118" width="34" height="32" rx="8" fill="#4a43a8"/>
        <g font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="900" font-size="20" text-anchor="middle">
          <text x="242" y="134" fill="#f4f2ff">2</text>
          <text x="288" y="125" fill="#2b1030" font-size="26">1</text>
          <text x="331" y="141" fill="#f4f2ff">3</text>
        </g>
      </svg>
    </div>
    <div class="card">
      <h2>Joueurs (${S.players.length})</h2>
      <form class="row" onsubmit="addPlayer(event)">
        <input type="text" id="pname" placeholder="Prénom du joueur" maxlength="16" autocomplete="off">
        <button class="btn primary" type="submit">+</button>
      </form>
      <div class="plist">
        ${S.players.map((p,i)=>`<div class="pitem"><span>${esc(p)}</span><button onclick="rmPlayer(${i})" aria-label="Supprimer">✕</button></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Objectif</h2>
      <div class="target">
        ${[100,150,200,250].map(v=>`<button class="${S.target===v?'on':''}" onclick="setTarget(${v})">${v}</button>`).join('')}
      </div>
    </div>
    <button class="btn primary full" ${S.players.length<2?'disabled':''} onclick="startGame()">Lancer la partie</button>`;
}
function addPlayer(e){
  e.preventDefault();
  const el=$('#pname');const v=el.value.trim();
  if(v&&S.players.length<18){S.players.push(v);save();renderSetup();$('#pname').focus();}
}
function rmPlayer(i){S.players.splice(i,1);save();renderSetup();}
function setTarget(v){S.target=v;save();renderSetup();}
function startGame(){S.started=true;S.rounds=[];S.pending={};save();render();}

/* ---------- GAME ---------- */
function state(){
  const t=totals();const max=Math.max(...t);
  const leaders=t.filter(x=>x===max).length;
  const over=max>=S.target&&leaders===1;
  return{t,max,over,winner:over?t.indexOf(max):-1};
}
function renderGame(){
  const {t,max,over,winner}=state();
  const n=S.rounds.length;
  $('#sub').textContent=`Objectif ${S.target} pts · ${over?'partie terminée':'manche '+(n+1)}`;
  const last=S.rounds[n-1];
  const order=S.players.map((_,i)=>i).sort((a,b)=>t[b]-t[a]);
  const tieAtTop=max>=S.target&&!over;

  let h='';
  if(over){
    h+=`<div class="win"><div class="big">🏆 ${esc(S.players[winner])}</div>
      <p>gagne avec ${t[winner]} points en ${n} manche${n>1?'s':''} !</p>
      <button class="btn full" onclick="replay()">Rejouer avec les mêmes joueurs</button></div>`;
  }
  h+=`<div class="card"><h2>Classement</h2><div class="sb">`+
    order.map((i,r)=>{
      const d=last?last[i]:null;
      return `<div class="sbrow ${r===0&&t[i]>0?'first':''}">
        <div class="bar" style="width:${Math.min(100,t[i]/S.target*100)}%"></div>
        <div class="in"><div class="rank">${r+1}</div><div class="nm">${esc(S.players[i])}</div>
        ${d!==null?`<div class="delta ${d===0?'neg':''}">${d===0?'Bust':'+'+d}</div>`:''}
        <div class="tot">${t[i]}</div></div></div>`;
    }).join('')+`</div>
    ${tieAtTop?'<div class="goal">⚖️ Égalité en tête : une manche de plus !</div>':''}</div>`;

  if(!over){
    const allSet=S.players.every((_,i)=>S.pending[i]!==undefined);
    h+=`<div class="card"><h2>Manche ${n+1}</h2><div class="hint2">Tape le score directement, 🧮 pour le calculer carte par carte, 💥 pour un Bust.</div>`+
      S.players.map((p,i)=>{
        const v=S.pending[i];
        const f7=S.pendingF7&&S.pendingF7[i];
        return `<div class="rrow2"><span class="nm">${esc(p)}${f7?' ⭐':''}</span>
          <input type="tel" inputmode="numeric" class="sin ${v===0?'bust':''}" id="sc${i}" placeholder="pts" value="${v===undefined?'':v}" oninput="quick(${i},this)">
          <button class="ib" onclick="openSheet(${i})" aria-label="Calculer">🧮</button>
          <button class="ib b" onclick="quickBust(${i})" aria-label="Bust">💥</button></div>`;
      }).join('')+
      `<button class="btn primary full" id="vbtn" style="margin-top:6px" ${allSet?'':'disabled'} onclick="validateRound()">Valider la manche</button></div>`;
  }

  if(n>0){
    h+=`<div class="card"><details ${histOpen?'open':''} ontoggle="histOpen=this.open"><summary><h2 style="display:inline">Historique (${n})</h2></summary>
      <div class="hint2" style="margin:8px 0 0">Touche un score pour le corriger.</div>
      <div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th></th>${S.players.map(p=>`<th>${esc(p.slice(0,7))}</th>`).join('')}</tr></thead><tbody>`+
      S.rounds.map((r,k)=>`<tr><td>M${k+1}</td>${r.map((v,i)=>`<td class="ed ${v===0?'z':''}" onclick="editCell(${k},${i})">${v===0?'✕':v}</td>`).join('')}</tr>`).join('')+
      `</tbody><tfoot><tr><td>Total</td>${t.map(v=>`<td>${v}</td>`).join('')}</tr></tfoot></table></div>
      <div class="foot"><button class="btn danger" onclick="undoRound()">↩︎ Annuler la dernière manche</button></div></details></div>`;
  }
  h+=`<div class="foot"><button class="btn" onclick="replay()">Rejouer</button><button class="btn danger" onclick="newGame()">Changer les joueurs</button></div>`;
  $('#app').innerHTML=h;
}
let histOpen=false;
function editCell(k,i){
  sh=null;
  const cur=S.rounds[k][i];
  $('#sheet').innerHTML=`
    <h3>${esc(S.players[i])} · Manche ${k+1}</h3>
    <div class="hint">Score actuel : ${cur}. Entre le score corrigé.</div>
    <input type="tel" inputmode="numeric" id="ecell" value="${cur}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,3)">
    <div class="actions">
      <button class="btn danger" onclick="saveCell(${k},${i},0)">💥 Bust</button>
      <button class="btn primary" onclick="saveCell(${k},${i})">Enregistrer</button>
    </div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Annuler</button></div>`;
  $('#ov').classList.add('open');
  const el=$('#ecell');el.focus();el.select();
}
function saveCell(k,i,forced){
  const v=forced!==undefined?forced:parseInt($('#ecell').value,10);
  if(isNaN(v))return;
  S.rounds[k][i]=v;
  histOpen=true;
  save();closeSheet();render();
}
function quick(i,el){
  const v=el.value.replace(/[^0-9]/g,'').slice(0,3);
  el.value=v;
  S.pendingF7=S.pendingF7||{};
  if(v==='')delete S.pending[i];else S.pending[i]=parseInt(v,10);
  S.pendingF7[i]=false;
  el.classList.toggle('bust',v==='0');
  save();
  const b=$('#vbtn');
  if(b)b.disabled=!S.players.every((_,k)=>S.pending[k]!==undefined);
}
function quickBust(i){
  S.pending[i]=0;
  S.pendingF7=S.pendingF7||{};S.pendingF7[i]=false;
  save();render();
}
function validateRound(){
  S.rounds.push(S.players.map((_,i)=>S.pending[i]));
  S.pending={};S.pendingF7={};save();render();
  window.scrollTo({top:0,behavior:'smooth'});
}
let askCb=null;
function ask(title,msg,okLabel,fn){
  sh=null;askCb=fn;
  $('#sheet').innerHTML=`
    <h3>${title}</h3>
    <div class="hint" style="font-size:15px;margin:6px 0 16px">${msg}</div>
    <div class="actions">
      <button class="btn" onclick="closeSheet()">Annuler</button>
      <button class="btn danger" onclick="askOk()">${okLabel}</button>
    </div>`;
  $('#ov').classList.add('open');
}
function askOk(){
  const f=askCb;askCb=null;closeSheet();
  if(f)f();
}
function undoRound(){
  if(!S.rounds.length)return;
  ask('Annuler la manche '+S.rounds.length+' ?','Les scores de la dernière manche seront supprimés.','Supprimer',()=>{
    S.rounds.pop();save();render();
  });
}
function doReplay(){
  S.rounds=[];S.pending={};S.pendingF7={};save();render();
  window.scrollTo({top:0});
}
function replay(){
  if(S.rounds.length&&!state().over){
    ask('Rejouer ?','La partie en cours sera remise à zéro (mêmes joueurs).','Rejouer',doReplay);
  }else doReplay();
}
function newGame(){
  ask('Changer les joueurs ?','La partie en cours sera perdue et tu reviendras à la liste des joueurs.','Continuer',()=>{
    S.started=false;S.rounds=[];S.pending={};S.pendingF7={};save();render();
  });
}

/* ---------- SHEET (calcul d'une manche) ---------- */
let sh=null;
const MODS=[['x2','×2'],['p2','+2'],['p4','+4'],['p6','+6'],['p8','+8'],['p10','+10']];
function calc(){
  let sum=0;sh.nums.forEach(n=>sum+=n);
  if(sh.mods.has('x2'))sum*=2;
  ['p2','p4','p6','p8','p10'].forEach(m=>{if(sh.mods.has(m))sum+=parseInt(m.slice(1))});
  const f7=sh.nums.size===7;
  if(f7)sum+=15;
  return{score:sum,f7};
}
function openSheet(i){
  sh={i,nums:new Set(),mods:new Set(),manual:S.pending[i]!==undefined?String(S.pending[i]):''};
  $('#ov').classList.add('open');drawSheet();
}
function closeSheet(){$('#ov').classList.remove('open');sh=null;}
function drawSheet(){
  const {score,f7}=calc();
  const manual=sh.manual!=='';
  const shown=manual?(parseInt(sh.manual)||0):score;
  $('#sheet').innerHTML=`
    <h3>${esc(S.players[sh.i])}</h3>
    <div class="hint">Touche les cartes numérotées devant le joueur</div>
    <div class="lbl">Cartes numéros</div>
    <div class="grid">${Array.from({length:13},(_,n)=>`<button class="chip ${sh.nums.has(n)?'on':''}" onclick="togNum(${n})">${n}</button>`).join('')}</div>
    <div class="lbl">Bonus</div>
    <div class="grid mods">${MODS.map(([k,l])=>`<button class="chip mod ${sh.mods.has(k)?'on':''}" onclick="togMod('${k}')">${l}</button>`).join('')}</div>
    <div class="total"><div><small>${manual?'Saisie manuelle':(f7?'⭐ FLIP 7 ! +15':sh.nums.size+' / 7 cartes')}</small></div><b id="tot">${shown}</b></div>
    <input type="tel" inputmode="numeric" id="man" placeholder="…ou saisir le total directement" value="${esc(sh.manual)}" oninput="onMan(this.value)">
    <div class="actions">
      <button class="btn danger" onclick="commit(0,false)">💥 Bust</button>
      <button class="btn primary" onclick="commitCalc()">Valider</button>
    </div>`;
}
function togNum(n){sh.nums.has(n)?sh.nums.delete(n):sh.nums.add(n);sh.manual='';drawSheet();}
function togMod(k){sh.mods.has(k)?sh.mods.delete(k):sh.mods.add(k);sh.manual='';drawSheet();}
function onMan(v){
  sh.manual=v.replace(/[^0-9]/g,'');
  const {score}=calc();
  $('#tot').textContent=sh.manual!==''?parseInt(sh.manual):score;
}
function commitCalc(){
  const {score,f7}=calc();
  if(sh.manual!=='')commit(parseInt(sh.manual)||0,false);
  else commit(score,f7);
}
function commit(v,f7){
  S.pending[sh.i]=v;
  S.pendingF7=S.pendingF7||{};S.pendingF7[sh.i]=f7;
  save();closeSheet();render();
}

function render(){
  if(!S.started||S.players.length<2){S.started=false;renderSetup();}
  else renderGame();
}
render();
</script>
</body>
</html>
